# 修改说明：首次生成，未做改动
# 每个步骤都带注释，可直接修改；改完请在上方填写修改说明再保存。

name: Build APK

on:
  workflow_dispatch:   # 允许在 App 里点「手动触发构建」
    inputs:
      app_name:
        description: 安装包名称
        default: 'SQLlite'
      version_name:
        description: 版本号（versionName）
        default: '1.3.0'
      version_code:
        description: 版本代号（versionCode，整数）
        default: '4'

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub 免费提供的 Linux 构建机
    steps:
      # 1. 把仓库代码拉到构建机上
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 准备 JDK（Gradle 8 需要 17，老项目可改成 11）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@main

      - name: Setup Android SDK
        uses: android-actions/setup-android@main
        with:
          packages: ''
          #cmdline-tools-version: 8512546 #Android_7

      # 3. gradlew 必须可执行，否则报 Permission denied
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      # 4. 改成你在 App 里填的版本号（同时兼容 build.gradle 与 .kts）
      - name: Set version
        env:
          VN: ${{ github.event.inputs.version_name }}
          VC: ${{ github.event.inputs.version_code }}
        run: |
          for f in $(find . -name "build.gradle" -o -name "build.gradle.kts"); do
            sed -i -E "s/versionName.*/versionName = \"$VN\"/" "$f"
            sed -i -E "s/versionCode.*/versionCode = $VC/" "$f"
          done
          echo "版本已设为 $VN ($VC)"

      # 5. 构建；命令可以按需改，例如只编某个模块 :app:assembleDebug
      - name: Build Release APK
        run: |
          gradle :app:assembleRelease #./gradlew assembleRelease --no-daemon
          sudo find . -type f -name "*.apk" -print0 | xargs -0 -I {} mv -n {} app/

      # 上传产物：构建完后在 App 里点开这条运行记录即可下载、自动安装
      - name: Upload APK
        uses: actions/upload-artifact@main
        with:
          name: SQLlite
          path: |
            ./**/*.apk
            ./app/*.apk
